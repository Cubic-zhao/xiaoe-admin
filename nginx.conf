user  nginx;
worker_processes auto;
events {
    worker_connections  1024;
    accept_mutex on;
    multi_accept on;
    use epoll;
}
http {
    # 容器只经宿主反代访问：透传宿主 nginx 写入的 X-Real-IP；直连调试时回落到对端地址
    map $http_x_real_ip $xiaoe_client_ip {
        default $http_x_real_ip;
        ""      $remote_addr;
    }
    log_format xiaoe_access '$xiaoe_client_ip $request_method $uri $status $request_time';
    access_log /var/log/nginx/access.log xiaoe_access;
    include       mime.types;
    default_type  application/octet-stream;
    keepalive_timeout       60s;
    # 与 24 号 D-03 一致：后端 multipart 210MB，APK 一般 30-150MB
    client_max_body_size    210m;
    sendfile                on;
    server_tokens           off;
    gzip                    on;
    gzip_min_length         1024;
    gzip_comp_level         5;
    gzip_buffers            4 16k;
    gzip_types              text/xml text/plain text/css text/javascript application/javascript application/json application/xml;
    server {
        listen 80;
        server_name _;
        # 安全响应头；location 内另写 add_header 时需重复，否则不会继承
        add_header X-Frame-Options DENY always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        location ~ /\.[^/]+ { return 404; }
        location = /index.html {
            root /usr/share/nginx/html;
            add_header Cache-Control "no-store";
            add_header X-Frame-Options DENY always;
            add_header X-Content-Type-Options nosniff always;
            add_header Referrer-Policy strict-origin-when-cross-origin always;
        }
        location ~ ^/gateway/([^/]+/admin/|system/api/(sys/config/website|common/(code|enum))$) {
            rewrite ^/gateway/(.*)$ /$1 break;
            proxy_pass http://gateway:7700;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $xiaoe_client_ip;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
            proxy_connect_timeout 5s;
            proxy_read_timeout 60s;
        }
        location /gateway/ { return 404; }
        location / {
            root /usr/share/nginx/html;
            try_files $uri $uri/ /index.html;
        }
    }
}
