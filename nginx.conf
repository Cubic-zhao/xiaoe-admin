user  nginx;
worker_processes auto;
events {
    worker_connections  1024;
    accept_mutex on;
    multi_accept on;
    use epoll;
}
http {
    log_format xiaoe_access '$remote_addr $request_method $uri $status $request_time';
    access_log /var/log/nginx/access.log xiaoe_access;
    include       mime.types;
    default_type  application/octet-stream;
    keepalive_timeout       60s;
    client_max_body_size    10m;
    sendfile                on;
    gzip                    on;
    gzip_min_length         1024;
    gzip_comp_level         5;
    gzip_buffers            4 16k;
    gzip_types              text/xml text/plain text/css text/javascript application/javascript application/json application/xml;
    server {
        listen 80;
        server_name _;
        location ~ /\.[^/]+ { return 404; }
        location = /index.html { root /usr/share/nginx/html; add_header Cache-Control "no-store"; }
        location ~ ^/gateway/([^/]+/admin/|system/api/(sys/config/website|common/(code|enum))$) {
            rewrite ^/gateway/(.*)$ /$1 break;
            proxy_pass http://gateway:7700;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
            proxy_connect_timeout 5s;
            proxy_read_timeout 60s;
        }
        location /gateway/ { return 404; }
        location / {
            root /usr/share/nginx/html;
            try_files $uri $uri/ /index.html;
        }
    }
}
